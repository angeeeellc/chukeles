spring:
  application:
    nombre: chukeles-backend
  datasource:
    url: jdbc:h2:file:./data/chukeles;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: never
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ── Configuración JWT y uploads ───────────────────────────────────────────────
chukeles:
  jwt:
    secreto: chukeles-secreto-super-seguro-para-jwt-minimo-64-caracteres-requeridos-hmac
    expiracion-ms: 86400000  # 24 horas en milisegundos
  upload:
    ruta: ./uploads
  cloudinary:
    cloud-name: cnperczl
    api-key: 916287336596523
    api-secret: 5XVycH9RKwPICP-10tPQ8DwKa68

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# ── JWT y uploads en producción ───────────────────────────────────────────────
chukeles:
  jwt:
    secreto: ${JWT_SECRETO:chukeles-secreto-super-seguro-para-jwt-minimo-64-caracteres-requeridos-hmac}
    expiracion-ms: ${JWT_EXPIRACION_MS:86400000}
  upload:
    ruta: ${UPLOAD_RUTA:/app/uploads}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:cnperczl}
    api-key: ${CLOUDINARY_API_KEY:916287336596523}
    api-secret: ${CLOUDINARY_API_SECRET:5XVycH9RKwPICP-10tPQ8DwKa68}
